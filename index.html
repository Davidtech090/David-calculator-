<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
        <title>My calculator</title>
        <link rel="stylesheet" href="style.css">
        <link rel="manifest"
        href="manifest.json">
    </head>
    <body>
        <div class=" calculator">
            <input type="text" id="disply"
            randonly>
            <div class="buttons">
                <button
        onclick="cleardisplay()">c</button>
                 <button
        onclick="deletelast()">Del</button>
        <button
        onclick="addTodisplay('%')">%</button>
        <button
        onclick="addTodisplay('/')">/</button>
        <button
        onclick="addTodisplay('7')">7</button>
        <button
        onclick="addTodisplay('8')">8</button>
        <button
        onclick="addTodisplay('9')">9</button>
        <button
        onclick="addTodisplay('*')">*</button>
        <addtodisplay
        oncaddtodisplayisplay('4')">4</button>
        <button
        onclick="addTodisplay('5')">5</button>
        <button
        oncaddtodisplayisplay('6')">6</button>
        <button
        onclick="addTodisplay('-')">-</button>
        <button
        oncaddtodisplayisplay('1')">1</button>
        <button
        onclick="addTodisplay('2')">2</button>
        <button
        oncaddtodisplayisplay('3')">3</button>
        <button
        onclick="addTodisplay('+')">+</button>
        <button
        oncaddtodisplayisplay('0')">0</button>
        <button
        onclick="addTodisplay('.')">.</button>
        <button onclick="calculate()"
        class="equal">=</button>
            </div>
        </div>
        <script src="script.js"></script>
           
</body>
</html>
